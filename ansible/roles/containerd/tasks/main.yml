---
- name: Установить containerd
  ansible.builtin.apt:
    name: "{{ containerd_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Установить crictl
  ansible.builtin.unarchive:
    src: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/crictl
    owner: root
    group: root
    mode: "0755"

- name: Создать каталог конфигурации
  ansible.builtin.file:
    path: "{{ containerd_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Применить конфигурацию containerd
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Настроить endpoint для crictl
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      runtime-endpoint: unix://{{ containerd_socket }}
      image-endpoint: unix://{{ containerd_socket }}
      timeout: 10

- name: Включить и запустить containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true

- name: Применить отложенные рестарты
  ansible.builtin.meta: flush_handlers

- name: Дождаться готовности сокета
  ansible.builtin.wait_for:
    path: "{{ containerd_socket }}"
    state: present
    timeout: 30