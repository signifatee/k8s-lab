---
- name: Положить конфигурацию kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_config_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Проверить, инициализирован ли кластер
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: cp_admin_conf

- name: Инициализировать control plane
  ansible.builtin.command:
    cmd: "kubeadm init --config {{ kubeadm_config_path }} --upload-certs"
  when: not cp_admin_conf.stat.exists
  register: cp_init

- name: Создать каталог .kube для пользователя
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

- name: Положить kubeconfig пользователю
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Дождаться готовности API
  ansible.builtin.command: kubectl get --raw /healthz
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cp_healthz
  until: cp_healthz.stdout == "ok"
  retries: 30
  delay: 5
  changed_when: false

- name: Забрать kubeconfig на управляющую машину
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../../kubeconfig"
    flat: true

- name: Сгенерировать join-команду
  ansible.builtin.command: kubeadm token create --print-join-command
  register: cp_join_command
  changed_when: false