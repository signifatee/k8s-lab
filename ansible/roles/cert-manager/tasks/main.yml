---
- name: Добавить helm-репозиторий cert-manager
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  delegate_to: localhost
  become: false
  run_once: true

- name: Установить cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_version }}"
    create_namespace: true
    release_namespace: cert-manager
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 10m
    values:
      crds:
        enabled: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Дождаться готовности webhook cert-manager
  kubernetes.core.k8s_info:
    kind: Deployment
    name: cert-manager-webhook
    namespace: cert-manager
    kubeconfig: "{{ kubeconfig_path }}"
  register: cm_webhook
  until: (cm_webhook.resources[0].status.readyReplicas | default(0)) > 0
  retries: 30
  delay: 5
  delegate_to: localhost
  become: false
  run_once: true

- name: Создать self-signed ClusterIssuer
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: selfsigned
      spec:
        selfSigned: {}
  delegate_to: localhost
  become: false
  run_once: true

- name: Создать корневой CA-сертификат
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: lab-ca
        namespace: cert-manager
      spec:
        isCA: true
        commonName: k8s-lab-ca
        secretName: lab-ca-key-pair
        duration: 87600h
        privateKey:
          algorithm: ECDSA
          size: 256
        issuerRef:
          name: selfsigned
          kind: ClusterIssuer
  delegate_to: localhost
  become: false
  run_once: true

- name: Создать ClusterIssuer на основе корневого CA
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: lab-ca-issuer
      spec:
        ca:
          secretName: lab-ca-key-pair
  delegate_to: localhost
  become: false
  run_once: true

- name: Дождаться выпуска корневого CA
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: lab-ca-key-pair
    namespace: cert-manager
    kubeconfig: "{{ kubeconfig_path }}"
  register: lab_ca_secret
  until: (lab_ca_secret.resources | default([]) | length) > 0
  retries: 30
  delay: 5
  delegate_to: localhost
  become: false
  run_once: true