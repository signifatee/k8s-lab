---
- name: Добавить helm-репозиторий Cilium
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  delegate_to: localhost
  become: false
  run_once: true

- name: Установить Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 10m
    values: "{{ lookup('template', 'cilium-values.yaml.j2') | from_yaml }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Дождаться готовности всех нод
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ kubeconfig_path }}"
  register: cni_nodes
  until: >
    (cni_nodes.resources | default([]))
    | map(attribute='status.conditions')
    | flatten
    | selectattr('type', 'eq', 'Ready')
    | selectattr('status', 'eq', 'True')
    | list | length == groups['all'] | length
  retries: 30
  delay: 10
  delegate_to: localhost
  become: false
  run_once: true